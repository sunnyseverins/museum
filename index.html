<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum, Very Louvre</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/visiting.css">
</head>
<body>
    <header>
        <div class="body--dark">
            <div class="container container--flex">
                <div class="header-logo">
                    <a class="header-logo__wrapper container--flex" href="">
                        <div class="logo"></div>
                        <div class="title">Louvre</div>
                    </a>
                </div>
                <nav class="header-menu">
                    <ul class="header-menu__wrapper container--flex">
                        <li><a href="#visiting">Visiting</a></li>
                        <li><a href="#explore">Explore</a></li>
                        <li><a href="#video">Video</a></li>
                        <li><a href="#gallery">Gallery</a></li>
                        <li><a href="#tickets">Tickets</a></li>
                        <li><a href="#contacts">Contacts</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="welcome">
            <div class="section body--dark">
                <div class="container">
                    <div class="welcome__wrapper">
                        <h1>Welcome<br>to the Louvre</h1>
                        <p>From the castle to the museum</p>
                        <a href="#visiting">Discover the Louvre</a>
                    </div>
                    <div class="welcome__image">
                        <img src="/assets/img/welcome-mona.jpg" alt="Slider showcasing works of art">
                    </div>
                </div>
            </div>
        </section>
        <section id="visiting">
            <div class="section">
                <div class="container">
                    <h2>Virtual tour</h2>
                    <div class="virtual-tour container--flex">
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Royal Palace</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Denon Wing</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Colonnade Perrault</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Greek Hall</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Mona Lisa</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                        <a href="">
                            <img src="" alt="" class="virtual-tour__img">
                            <h3 class="virtual-tour__title">Night Palace</h3>
                            <p class="virtual-tour_description"></p>
                        </a>
                    </div>
                </div>
            </div>
        </section>
        <section id="explore">
            <div class="section body--dark">
                <div class="container"></div>
            </div>
        </section>
        <section id="video">
            <div class="section">
                <div class="container"></div>
            </div>
        </section>
        <section id="gallery">
            <div class="section body--dark">
                <div class="container"></div>
            </div>
        </section>
        <section id="tickets">
            <div class="section">
                <div class="container"></div>
            </div>
        </section>
        <section id="contacts">
            <div class="section">
                <div class="container"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="body--dark">
            <div class="container">

            </div>
        </div>
    </footer>
</body>
</html>
